# BrightBean Chat - Coolify deployment variant.
#
# Derived from the upstream reference stack (docker-compose.prod.yml, SPEC
# section 20). The only changes are the three the platform forces, and each
# one is upstream's own answer to the same constraint:
#
#   1. caddy is removed. The platform proxy already terminates TLS and owns
#      80/443 on this host, so a second listener would collide with it.
#      Upstream ships deploy/docker-compose.external-tls.yml for exactly this
#      case ("TLS somewhere else").
#   2. the app publishes on loopback only - upstream's external-tls shape.
#      A deployment that believes it is behind TLS must never be reachable
#      over plain HTTP from outside.
#   3. the app joins the platform's network, which is what the proxy routes
#      to.
#
# Everything else is upstream's, unchanged:
#
#   * nothing secret has a default - every required value uses the
#     ${VAR:?message} form, so the stack refuses to start and names the
#     variable that is missing;
#   * postgres publishes no port at all, not even loopback;
#   * APP_DOMAIN feeds ALLOWED_HOSTS and APP_URL, so one hostname configures
#     the deployment;
#   * the app's healthcheck presents APP_URL's hostname as the Host header,
#     because a production ALLOWED_HOSTS does not list 127.0.0.1.
#
# The proxy in front of the app must add X-Forwarded-Proto: https and pass
# the original Host header unchanged - upstream's external-tls file names
# both. TRUSTED_PROXIES below defaults to Docker's bridge range, which is
# where the platform proxy sits on this host.
# The reference production stack (SPEC §20).
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Five services: postgres, a one-shot migrate, the gunicorn app, the queue
# worker, and Caddy terminating TLS in front of them. `docs/self-hosting.md` is
# the walkthrough; `deploy/env.prod.example` is the file you copy to `.env`.
#
# Two rules shape everything below, and both come from SECURITY-BASELINE §8.
#
# 1. NOTHING SECRET HAS A DEFAULT. Every value that must be unique to this
#    deployment uses compose's `${VAR:?message}` form, so `up` aborts before it
#    pulls an image, naming the variable. docker-compose.yml (the development
#    stack) defaults everything on purpose so a fresh clone runs; this file is
#    the opposite file and defaults nothing that matters.
#
# 2. NOTHING IS PUBLISHED EXCEPT CADDY. Postgres holds contacts and the
#    encrypted platform credentials, so it has no `ports:` key at all — not even
#    a loopback one. The app is reachable only through the proxy that adds TLS.
#
# One hostname configures the deployment. APP_DOMAIN feeds Caddy's site
# address, Django's ALLOWED_HOSTS and the APP_URL that public links are built
# from, so there is no way to end up with a permissive ALLOWED_HOSTS by
# forgetting a second variable. Override ALLOWED_HOSTS or APP_URL individually
# only when the deployment answers on more than one name.

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.production
  # Assembled from the parts below so the password exists in exactly one place.
  # Setting DATABASE_URL directly wins, for a deployment pointed at a managed
  # Postgres — the nested `:?` is evaluated only when this default is used.
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-brightbean}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — see deploy/env.prod.example}@postgres:5432/${POSTGRES_DB:-brightbean_chat}}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY — generate one with `make prod-secrets`, see deploy/env.prod.example}
  ENCRYPTION_KEY_SALT: ${ENCRYPTION_KEY_SALT:?set ENCRYPTION_KEY_SALT — generate one with `make prod-secrets`, see deploy/env.prod.example}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${APP_DOMAIN:?set APP_DOMAIN to the hostname this deployment answers on, e.g. chat.example.com — see deploy/env.prod.example}}
  APP_URL: ${APP_URL:-https://${APP_DOMAIN:?set APP_DOMAIN to the hostname this deployment answers on, e.g. chat.example.com — see deploy/env.prod.example}}
  # Caddy is the only thing that talks to the app, and it writes
  # X-Forwarded-For itself, so the auth rate limiter can trust that header from
  # inside the compose network. Overridable for a deployment behind a second
  # proxy — see docs/self-hosting.md.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES-172.16.0.0/12}
  # The environment is the single source of truth inside the container. A .env
  # still reaches it through `env_file` below (that is how PLATFORM_* and the
  # SMTP settings arrive); this stops the settings loader reading the file a
  # second time and disagreeing with what compose interpolated.
  DJANGO_ENV_FILE: /nonexistent

# Everything built from the app image shares these. Kept in one anchor so a
# service cannot quietly miss one.
x-app-service: &app-service
  build: .
  # The name given to the image this file BUILDS. It is not pullable as it
  # stands: no workflow in this repository pushes an image anywhere, so
  # `brightbean-chat:latest` resolves to a local build and nothing else. The
  # upgrade path in docs/self-hosting.md is therefore git-pull-and-build.
  #
  # IMAGE_REPOSITORY exists for a fork that does publish one — set it to a
  # qualified name like ghcr.io/you/brightbean-chat and `pull` starts working,
  # with IMAGE_TAG selecting the release.
  image: ${IMAGE_REPOSITORY:-brightbean-chat}:${IMAGE_TAG:-latest}
  environment: *app-environment
  env_file:
    - path: .env
      required: false
  security_opt:
    - no-new-privileges:true
  # The image already runs as uid 1001 and binds an unprivileged port, so it
  # needs no capabilities at all.
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brightbean_chat}
      POSTGRES_USER: ${POSTGRES_USER:-brightbean}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — generate one with `make prod-secrets`, see deploy/env.prod.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately no `ports:`. Not even 127.0.0.1 — a loopback publish is still
    # reachable from every other container and from anything that can open an
    # SSH tunnel. Reach it with `docker compose exec postgres psql`; the backup
    # and restore recipes in docs/self-hosting.md do exactly that.
    #
    # No cap_drop here: the entrypoint starts as root and drops to the postgres
    # user, which needs CAP_SETUID/CAP_SETGID/CAP_CHOWN.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brightbean} -d ${POSTGRES_DB:-brightbean_chat}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app-service
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
    # A one-shot. `restart: unless-stopped` here would loop the migration
    # forever once it succeeded and the container exited 0.
    restart: "no"

  app:
    <<: *app-service
    # The platform proxy terminates TLS in front of this stack, so Caddy is
    # not in the picture and this is upstream's own
    # deploy/docker-compose.external-tls.yml shape: the app is published on
    # loopback only, never on 0.0.0.0.
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-8000}:8000"
    # No explicit networks here, on purpose.
    #
    # The platform attaches every service of this compose to the resource's
    # own network, and the platform proxy sits on that same network - which
    # is what the generated traefik.docker.network label names, so routing
    # does not need anything more.
    #
    # Joining the shared "coolify" network as well would break the database
    # connection, and not in an obvious way: that network carries a
    # "postgres" alias belonging to another stack (the Dograh database), so
    # the name resolves to the wrong server. The TCP connection then
    # succeeds and the failure arrives one layer later, as
    # "password authentication failed" - which the application reports as
    # "database unreachable" and which hides the real cause. The other
    # services are unaffected because the platform's own network is the only
    # one they are on.
    # Exec form, so gunicorn is PID 1 and takes SIGTERM directly — `docker
    # stop` and every rolling upgrade then drain in-flight webhook requests
    # instead of hard-killing them after the grace period.
    #
    # 2 workers × 2 threads, not the 4 × 2 the reference stack specifies
    # (SPEC §20): this host carries 4 CPUs at a load average around 10, so
    # the reference count would oversubscribe it. Raise it when the
    # deployment moves to its own host.
    #
    # No `--access-logfile`: gunicorn's access log records the full request line
    # including the query string, which is where /internal/tick?token=… and
    # Meta's hub.verify_token live. The application log is scrubbed
    # (SECURITY-BASELINE §5); gunicorn's is not. docs/self-hosting.md documents
    # turning it on deliberately.
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --threads
      - "2"
    expose:
      - "8000"
    # Cloudflare tunnel -> Traefik HTTP entrypoint: Traefik rewrites
    # X-Forwarded-Proto to "http", Django (SECURE_SSL_REDIRECT) answers 301 to
    # itself. This router wins on the HTTP entrypoint and restores "https",
    # as upstream's external-tls file requires.
    labels:
      - traefik.http.middlewares.bb-xfp.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.bb-http.rule=Host(`brightbean.idstar.de`)
      - traefik.http.routers.bb-http.entrypoints=http
      - traefik.http.routers.bb-http.priority=1000
      - traefik.http.routers.bb-http.middlewares=bb-xfp
      - traefik.http.routers.bb-http.service=bb-app
      - traefik.http.services.bb-app.loadbalancer.server.port=8000
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The probe connects to the loopback address but presents APP_URL's hostname
    # as the Host header. Django resolves ALLOWED_HOSTS against that header, and
    # a production ALLOWED_HOSTS does not list 127.0.0.1 — so the obvious
    # spelling of this healthcheck (the one docker-compose.yml uses, where
    # ALLOWED_HOSTS defaults to include 127.0.0.1) makes Django answer 400
    # DisallowedHost to every probe. The container then never becomes healthy,
    # caddy never starts because it waits on it, and nothing in the output says
    # why. Widening ALLOWED_HOSTS to keep the simpler probe working would trade
    # a real setting for a convenience.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import os, urllib.request as r; from urllib.parse import urlparse; h = urlparse(os.environ['APP_URL']).hostname; r.urlopen(r.Request('http://127.0.0.1:8000/healthz', headers={'Host': h}), timeout=4)"
    # Deliberately generous. `caddy` waits on this service being HEALTHY, so a
    # probe that times out does not merely mark a container yellow — it makes
    # `docker compose up` fail with "dependency failed to start" and no proxy.
    # The first request after boot pays for Django's lazy imports and the first
    # database connection, and docs/self-hosting.md names 1 vCPU / 1 GB as a
    # workable host, where that can take several seconds. start_period failures
    # do not count against `retries`, so the grace costs nothing.
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  worker:
    <<: *app-service
    command: ["python", "manage.py", "process_tasks"]
    volumes:
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Scale it with `--scale worker=N`: the claim statement uses FOR UPDATE SKIP
    # LOCKED, so concurrent workers take disjoint batches (SPEC §15).
    #
    # Deliberately no healthcheck, for the reason docker-compose.yml gives: the
    # worker serves no port, and a probe that shelled into it would report
    # "alive" for a process stuck on a handler just as happily as for a healthy
    # one. Zombie recovery is the real liveness mechanism.
    restart: unless-stopped


networks:
  # The platform proxy's network. Coolify attaches every resource to it, and
  # it is what the proxy routes to. External because the platform owns it.
  coolify:
    external: true
    name: ${TRAEFIK_NETWORK:-coolify}

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
